# CI: run the tests and prove the frontend still builds.
#
# WHY THIS EXISTS
# A push to main is a full ship. Xcode Cloud builds it to TestFlight, Vercel
# deploys the frontend, Railway deploys the backend. Until now nothing ran
# between "git push" and Ellie's phone. The 110 unit tests only ran when
# somebody remembered to type `npx -y vitest`.
#
# Deliberately small and fast. Two jobs, one Node version, npm cache on. If
# this takes more than a couple of minutes people will start pushing round it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless. Cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test --workspace backend

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The build catches broken imports and syntax errors. It does NOT catch an
      # undefined identifier: that is valid syntax and only fails when the line
      # runs, which is how `FROM_EMOJI is not defined` reached production with a
      # green build. `npm run build` now runs scripts/check-icons.mjs first,
      # which evaluates the module and actually calls it.
      - run: npm run build --workspace frontend
        env:
          # Vite inlines these at build time. Real values live in Vercel; CI
          # only needs the build to complete, so placeholders are correct here
          # and keep real keys out of the workflow.
          VITE_API_URL: https://api.florrie.ai
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

      # Reordering is a GESTURE, and no amount of "the page rendered without
      # errors" proves a gesture works. Three separate DragList bugs all built,
      # parsed and rendered fine, and failed the moment a finger moved. This
      # drives real touch PointerEvents. Needs a browser, so it lives here
      # rather than in `npm run build` (Xcode Cloud has no chromium).
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run check:drag --workspace frontend

      # The rest of the browser checks ride along free — chromium is already
      # installed by the step above, so these cost seconds, not minutes.
      #
      # check:tap:browser proves the 44px expansion actually reaches the finger.
      # A class name in the markup proves nothing: the expansion can be clipped
      # by an ancestor's overflow, sit off-centre, or steal the neighbouring
      # control's taps, and in all three cases the diff looks correct and the
      # app is worse. Two of those three were real, and were caught here.
      - run: npm run check:tap:browser --workspace frontend

      # check:safe-area renders every page with a 15 Pro's insets and asks what
      # lands under the notch or in the home-indicator swipe zone. It does NOT
      # prove env(safe-area-inset-*) resolves in WKWebView — headless chromium
      # reports 0 for those — so a pass is the arithmetic, not the plumbing.
      - run: npm run check:safe-area --workspace frontend

      # check:overflow finds text the phone cannot show: boxes past 390px, and
      # text clipped by its own container with no ellipsis. "So much text is
      # hidden now" was a real report from a real user.
      - run: npm run check:overflow --workspace frontend

      # check:contrast measures every text node against what is actually
      # painted behind it. LIGHT ONLY, deliberately: dark mode currently fails
      # on 64 nodes and is unreachable in the app anyway (theme.jsx starts
      # light, does not persist, does not read prefers-color-scheme), so
      # gating on it would block every push for a palette nobody can see.
      # Run `npm run check:contrast:dark` to see the debt.
      - run: npm run check:contrast --workspace frontend

      # check:numerals asks the browser what face each figure is PAINTED in.
      # Levi has reported the same thing twice from two screens, most recently
      # a "£345" that sat inside a Playfair headline with a colour and a
      # weight of its own but no font-family, so it inherited the serif. That
      # is not findable by reading; it needs measuring.
      - run: npm run check:numerals --workspace frontend

      # check:deferred proves PostHog and Sentry still ARRIVE after being moved
      # behind first paint. The risk in that change is not a crash, it is
      # silence — two implementations shipped past a green build loading
      # NEITHER chunk, and the only symptom would have been an empty dashboard
      # noticed weeks later.
      - run: npm run check:deferred --workspace frontend

      # check:live is the one that matters most, and it exists because all the
      # others were blind. They render through react-dom/server, which runs one
      # pass and never runs an effect, so every data-driven screen was graded in
      # its LOADING state. They were green on all 79 pages while the booking
      # page — the surface Ellie'"'"'s clients pay through — had three text nodes
      # under AA, because none of them exist until a fetch resolves.
      #
      # This mounts the real build in a browser with fixtures answering fetch,
      # so the DOM it grades is the DOM she looks at.
      - run: npm run check:live --workspace frontend
        env:
          # check:live seeds a session keyed on the project ref in this URL, so
          # it must match the one the dist above was built with or every
          # signed-in route silently renders the login page and passes.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
