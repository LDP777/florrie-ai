<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF8F5" />
    <title>Florrie — Your AI Team</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* ═══════════════════════════════════════════════
         FLORRIE DESIGN SYSTEM — Global Styles
         Soft Luxury: warm, feminine, premium
         ═══════════════════════════════════════════════ */

      :root {
        /* Core palette */
        --bg: #FAF8F5;
        --bg-card: #FFFFFF;
        --bg-elevated: #FFFFFF;
        --bg-hover: #F5F2EF;
        --bg-input: #FAF8F5;
        --bg-warm: #FFF9F6;

        /* Text */
        --text-primary: #2D2A26;
        --text-secondary: #7A756F;
        --text-muted: #B5AFA8;
        --text-inverse: #FFFFFF;

        /* Brand accent — dusty rose */
        --accent: #C76B8A;
        --accent-hover: #B85D7B;
        --accent-light: #FFF0F3;
        --accent-bg: #FBF0F3;

        /* Gold — premium accent */
        --gold: #C9A96E;
        --gold-light: #FDF8EE;
        --gold-bg: rgba(201, 169, 110, 0.08);

        /* Semantic */
        --success: #5BA97B;
        --success-bg: #EDF7F0;
        --warning: #D4943A;
        --warning-bg: #FEF5E7;
        --danger: #D4605C;
        --danger-bg: #FDF0EF;

        /* Borders & dividers */
        --border: #EDE9E4;
        --border-light: #F5F2EF;
        --border-focus: rgba(199, 107, 138, 0.4);

        /* Shadows — soft, layered */
        --shadow-xs: 0 1px 2px rgba(45, 42, 38, 0.04);
        --shadow-sm: 0 1px 3px rgba(45, 42, 38, 0.06), 0 1px 2px rgba(45, 42, 38, 0.04);
        --shadow-md: 0 4px 12px rgba(45, 42, 38, 0.06), 0 1px 3px rgba(45, 42, 38, 0.04);
        --shadow-lg: 0 8px 24px rgba(45, 42, 38, 0.08), 0 2px 6px rgba(45, 42, 38, 0.04);
        --shadow-glow: 0 0 0 3px rgba(199, 107, 138, 0.1);

        /* Radius */
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 20px;
        --radius-full: 9999px;

        /* Typography */
        --font-display: 'Playfair Display', Georgia, serif;
        --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-mono: 'DM Mono', 'SF Mono', monospace;

        /* Nav */
        --nav-bg: #FFFFFF;
        --nav-border: #EDE9E4;
        --overlay: rgba(45, 42, 38, 0.18);

        /* Transitions */
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --duration-fast: 0.15s;
        --duration-normal: 0.25s;
        --duration-slow: 0.4s;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background var(--duration-slow) var(--ease-out),
                    color var(--duration-slow) var(--ease-out);
        line-height: 1.5;
        letter-spacing: -0.01em;
      }

      /* Display headings use Playfair */
      h1, .display-heading {
        font-family: var(--font-display);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      /* ─── Animations ─── */

      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(32px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes slideDown {
        from { opacity: 0; transform: translateY(-16px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* Page-level fade-in */
      .page-enter {
        animation: fadeIn var(--duration-normal) var(--ease-out);
      }

      /* ─── Interactive elements ─── */

      button {
        transition: transform var(--duration-fast) var(--ease-spring),
                    opacity var(--duration-fast) ease,
                    box-shadow var(--duration-normal) ease;
        -webkit-tap-highlight-color: transparent;
      }
      button:active { transform: scale(0.97); }

      input, textarea, select {
        transition: border-color var(--duration-normal) ease,
                    box-shadow var(--duration-normal) ease;
      }
      input:focus, textarea:focus, select:focus {
        border-color: var(--accent) !important;
        box-shadow: var(--shadow-glow);
        outline: none;
      }

      /* Toggle dot transitions */
      [style*="translateX"] {
        transition: transform 0.2s var(--ease-spring) !important;
      }

      /* ─── Custom controls ─── */

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        border: 2.5px solid #fff;
        box-shadow: var(--shadow-sm);
      }

      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-full); }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

      /* ─── Card style (applies via data attribute or class) ─── */

      .florrie-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xs);
        transition: box-shadow var(--duration-normal) ease,
                    transform var(--duration-normal) var(--ease-out);
      }

      .florrie-card:hover {
        box-shadow: var(--shadow-sm);
      }

      .florrie-card-elevated {
        background: var(--bg-card);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
      }

      /* ─── Gradient accents ─── */

      .gradient-rose {
        background: linear-gradient(135deg, #C76B8A 0%, #D4899F 50%, #C9A96E 100%);
        background-size: 200% 200%;
      }

      .gradient-gold {
        background: linear-gradient(135deg, #C9A96E 0%, #DFC18C 50%, #C76B8A 100%);
        background-size: 200% 200%;
      }

      .gradient-warm {
        background: linear-gradient(135deg, #FAF8F5 0%, #FFF0F3 50%, #FDF8EE 100%);
      }

      /* ─── Utility ─── */

      .text-display { font-family: var(--font-display); }
      .text-body { font-family: var(--font-body); }
      .text-mono { font-family: var(--font-mono); }
      .text-accent { color: var(--accent); }
      .text-gold { color: var(--gold); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
